<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyWing handheld home with touch keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6CA8FF}a:hover{color:#9cc4ff}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; background: #111215; color: #F3F4F6; font-family: 'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif; font-size: 16px; overflow: hidden; display: flex; flex-direction: column">

  <header style="height: 72px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px">
    <div role="tablist" aria-label="Sections" style="display: flex; gap: 4px; flex: none">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{t.on}}" style="height: 48px; padding: 0 18px; border-radius: 12px; background: {{t.bg}}; color: {{t.color}}; font-weight: 500">{{t.label}}</button>
      </sc-for>
    </div>
    <label for="hh-search" style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 12px; background: #1C1E23; border: 2px solid #6CA8FF; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AEB8" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="hh-search" value="harb" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #F3F4F6">
      <button aria-label="Clear search" style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #A9AEB8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </label>
    <button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 12px; background: #1C1E23; display: flex; align-items: center; justify-content: center; color: #C9CDD4">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
  </header>

  <section style="padding: 4px 24px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 14px; color: #A9AEB8">3 matches · the keyboard pushes the page up so results stay visible</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
        <article style="display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; background: #1C1E23; border: {{r.edge}}; box-shadow: {{r.glow}}">
          <div style="width: 148px; aspect-ratio: 16 / 9; border-radius: 10px; flex: none; background: {{r.cover}}"></div>
          <div style="min-width: 0"><div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</div><div style="font-size: 14px; color: #A9AEB8">{{r.meta}}</div></div>
        </article>
      </sc-for>
    </div>
  </section>

  <div style="flex: 1"></div>

  <div aria-label="Windows touch keyboard (system, shown for reference)" style="flex: none; height: 330px; background: #202227; border-top: 1px solid rgba(255,255,255,0.08); padding: 14px 120px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8B909A; padding: 0 4px 2px"><span>Windows touch keyboard · opened by SkyWing when a text box is tapped</span><span>ENG</span></div>
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="display: flex; gap: 8px; justify-content: center">
        <sc-for list="{{row.keys}}" as="k" hint-placeholder-count="10">
          <span style="width: {{k.w}}; height: 56px; border-radius: 8px; background: {{k.bg}}; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #E6E8EC">{{k.label}}</span>
        </sc-for>
      </div>
    </sc-for>
    <div style="display: flex; gap: 8px; justify-content: center">
      <span style="width: 96px; height: 56px; border-radius: 8px; background: #2E3138; display: flex; align-items: center; justify-content: center; font-size: 15px">&amp;123</span>
      <span style="width: 520px; height: 56px; border-radius: 8px; background: #3A3E46"></span>
      <span style="width: 130px; height: 56px; border-radius: 8px; background: #6CA8FF; color: #0B1220; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Search</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Home','Folders','Videos','Drives'].map((l, i) => ({ label: l, on: i === 0 ? 'true' : 'false', bg: i === 0 ? 'rgba(108,168,255,0.18)' : 'transparent', color: i === 0 ? '#F3F4F6' : '#A9AEB8' }));
    const results = [['Harbour Run','Home server · 1080p · 1 h 30 min','#7a3e2e,#1d1311'],['Harbour Lights','This PC · 4K · 52 min','#29506e,#0c1620'],['Harbour Walk 2023','Home server · 1080p · 18 min','#2e6b5a,#0e1d19']]
      .map((r, i) => ({ title: r[0], meta: r[1], cover: 'linear-gradient(135deg,' + r[2] + ')', edge: i === 0 ? '2px solid #6CA8FF' : '2px solid transparent', glow: i === 0 ? '0 0 0 4px rgba(108,168,255,0.22)' : 'none' }));
    const key = (label, w, bg) => ({ label, w: w || '72px', bg: bg || '#3A3E46' });
    const rows = [
      { keys: 'qwertyuiop'.split('').map((c) => key(c)).concat([key('⌫', '96px', '#2E3138')]) },
      { keys: 'asdfghjkl'.split('').map((c) => key(c)).concat([key('↵', '120px', '#2E3138')]) },
      { keys: [key('⇧', '96px', '#2E3138')].concat('zxcvbnm'.split('').map((c) => key(c))).concat([key(',', '72px'), key('.', '72px'), key('⇧', '96px', '#2E3138')]) },
    ];
    return { tabs, results, rows };
  }
}
</script>
</body>
</html>
