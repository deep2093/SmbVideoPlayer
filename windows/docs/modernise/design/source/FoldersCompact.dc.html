<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyWing compact folders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6CA8FF}a:hover{color:#9cc4ff}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
</style>
</helmet>
<div style="width: 1024px; height: 720px; display: flex; background: #111215; color: #F3F4F6; font-family: 'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif; font-size: 14px; overflow: hidden; position: relative">

  <nav aria-label="Sections" style="width: 72px; flex: none; background: #16181C; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px">
    <div style="width: 28px; height: 28px; border-radius: 8px; background: #6CA8FF; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#0B1220"></path></svg>
    </div>
    <a href="Main.dc.html" style="width: 60px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C9CDD4; text-decoration: none; font-size: 11px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="#" style="width: 60px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: rgba(108,168,255,0.16); color: #F3F4F6; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6CA8FF" stroke-width="1.8" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Folders</a>
    <a href="#" style="width: 60px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C9CDD4; text-decoration: none; font-size: 11px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>Videos</a>
    <a href="#" style="width: 60px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C9CDD4; text-decoration: none; font-size: 11px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"></rect><rect x="3" y="14" width="18" height="6" rx="1.5"></rect></svg>Drives</a>
    <div style="flex: 1"></div>
    <a href="SettingsDesktop.dc.html" style="width: 60px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C9CDD4; text-decoration: none; font-size: 11px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
  </nav>

  <main style="flex: 1; min-width: 0; padding: 0 24px; display: flex; flex-direction: column">
    <header style="height: 68px; display: flex; align-items: center; gap: 8px; flex: none">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; flex: 1">Folders</h1>
      <button aria-label="Search" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #C9CDD4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
      <button style="height: 36px; padding: 0 12px; border-radius: 8px; background: #24272D; border: 1px solid rgba(108,168,255,0.45); display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Name<span style="color: #6CA8FF">↑</span></button>
      <button aria-label="More options" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #C9CDD4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg></button>
    </header>
    <div role="tablist" aria-label="Folder kind" style="display: inline-flex; align-self: flex-start; padding: 3px; border-radius: 10px; background: #1C1E23; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 18px">
      <button role="tab" aria-selected="true" style="height: 32px; padding: 0 16px; border-radius: 8px; background: #2B2F37; font-weight: 500">Original</button>
      <button role="tab" aria-selected="false" style="height: 32px; padding: 0 16px; border-radius: 8px; color: #A9AEB8">Virtual</button>
      <button role="tab" aria-selected="false" style="height: 32px; padding: 0 16px; border-radius: 8px; color: #A9AEB8">Custom</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{folders}}" as="f" hint-placeholder-count="8">
        <article style="border-radius: 12px; overflow: hidden; background: #1C1E23; border: 1px solid rgba(255,255,255,0.06)">
          <div style="aspect-ratio: 16 / 10; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px">
            <div style="grid-row: span 2; background: {{f.a}}"></div><div style="background: {{f.b}}"></div><div style="background: {{f.c}}"></div>
          </div>
          <div style="padding: 9px 12px"><div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</div><div style="font-size: 12px; color: #A9AEB8">{{f.meta}}</div></div>
        </article>
      </sc-for>
    </div>
  </main>

  <div role="menu" aria-label="Sort folders" style="position: absolute; right: 64px; top: 58px; width: 236px; padding: 6px; border-radius: 12px; background: #24272D; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 12px 32px rgba(0,0,0,0.45)">
    <span style="display: block; font-size: 12px; color: #A9AEB8; padding: 6px 10px">Sort by · tap again to flip order</span>
    <sc-for list="{{sorts}}" as="s" hint-placeholder-count="4">
      <button role="menuitemradio" aria-checked="{{s.on}}" style="width: 100%; height: 38px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; background: {{s.bg}}">
        <span style="flex: 1; text-align: left">{{s.label}}</span><span style="color: {{s.arrowColor}}; font-size: 15px">{{s.arrow}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const g = ['#3b5b8c,#101a2e','#7a3e2e,#1d1311','#2e6b5a,#0e1d19','#5b3b7a,#140f1f','#8a6a2a,#1d170c','#29506e,#0c1620','#6e2940,#1b0c12','#3f6e2a,#111c0c'];
    const c = (i) => 'linear-gradient(135deg,' + g[i % g.length] + ')';
    const folders = [['Documentaries','42 videos · 186 GB'],['Family 2024','118 videos · 64 GB'],['Films 4K','27 videos · 1.2 TB'],['Holidays','56 videos · 92 GB'],['Music sessions','33 videos · 41 GB'],['Nature','71 videos · 310 GB'],['Series','204 videos · 880 GB'],['Travel','89 videos · 155 GB']]
      .map((f, i) => ({ name: f[0], meta: f[1], a: c(i), b: c(i + 3), c: c(i + 5) }));
    const sorts = [['Name','↑',true],['Size','↓',false],['Date added','↓',false],['Number of videos','↓',false]]
      .map((s) => ({ label: s[0], arrow: s[1], on: s[2] ? 'true' : 'false', bg: s[2] ? 'rgba(108,168,255,0.16)' : 'transparent', arrowColor: s[2] ? '#6CA8FF' : '#6B707A' }));
    return { folders, sorts };
  }
}
</script>
</body>
</html>
