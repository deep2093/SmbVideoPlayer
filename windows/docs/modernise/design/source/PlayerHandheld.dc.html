<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyWing player, handheld touch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; color: #F3F4F6; font-family: 'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif; font-size: 16px; background: radial-gradient(120% 90% at 30% 40%, #3b5b8c 0%, #142238 45%, #05070b 100%)">
  <span style="position: absolute; left: 24px; top: 92px; font-size: 12px; color: rgba(255,255,255,0.55)">sample frame</span>

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(rgba(0,0,0,0.65), transparent)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(transparent, rgba(0,0,0,0.8))"></div>

  <header style="position: absolute; left: 24px; right: 24px; top: 20px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Back to library" style="width: 56px; height: 56px; border-radius: 16px; background: rgba(20,22,26,0.55); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1; min-width: 0"><div style="font-size: 20px; font-weight: 600">Northern Lights · Part 2</div><div style="font-size: 14px; color: rgba(255,255,255,0.7)">Home server · 1080p · smoothing 2× · 60 fps</div></div>
    <button aria-label="Subtitles and audio" style="width: 56px; height: 56px; border-radius: 16px; background: rgba(20,22,26,0.55); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 13h4M13 13h4M7 16h7"></path></svg></button>
    <button aria-label="Lock touch controls" style="width: 56px; height: 56px; border-radius: 16px; background: rgba(20,22,26,0.55); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></button>
  </header>

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 36%; display: flex; align-items: center; justify-content: center">
    <div style="width: 148px; height: 148px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <span style="font-size: 26px">⟲</span><span style="font-size: 15px; font-weight: 600">−10 s</span><span style="font-size: 12px; color: rgba(255,255,255,0.7)">double-tap</span>
    </div>
  </div>

  <div style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 56px; height: 220px; border-radius: 28px; background: rgba(20,22,26,0.55); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 12px 0; box-sizing: border-box; gap: 10px">
    <div style="width: 6px; flex: 1; border-radius: 3px; background: rgba(255,255,255,0.2); position: relative"><div style="position: absolute; bottom: 0; left: 0; right: 0; height: 70%; border-radius: 3px; background: #F3F4F6"></div></div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
  </div>
  <span style="position: absolute; right: 90px; top: calc(50% + 96px); font-size: 12px; color: rgba(255,255,255,0.7)">swipe up/down on right half</span>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 40px">
    <button aria-label="Previous video" style="width: 64px; height: 64px; border-radius: 50%; background: rgba(20,22,26,0.55); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 6h2v12H7zM20 6v12l-9-6z"></path></svg></button>
    <button aria-label="Pause" style="width: 96px; height: 96px; border-radius: 50%; background: rgba(243,244,246,0.95); color: #0B1220; display: flex; align-items: center; justify-content: center">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
    <button aria-label="Next video" style="width: 64px; height: 64px; border-radius: 50%; background: rgba(20,22,26,0.55); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 6h2v12h-2zM4 6v12l9-6z"></path></svg></button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-size: 15px; font-variant-numeric: tabular-nums">38:12</span>
      <div style="flex: 1; height: 44px; display: flex; align-items: center; position: relative">
        <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.22)"></div>
        <div style="position: absolute; left: 0; width: 62%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.4)"></div>
        <div style="position: absolute; left: 0; width: 38%; height: 6px; border-radius: 3px; background: #6CA8FF"></div>
        <div style="position: absolute; left: calc(38% - 14px); width: 28px; height: 28px; border-radius: 50%; background: #F3F4F6; box-shadow: 0 2px 8px rgba(0,0,0,0.5)"></div>
      </div>
      <span style="font-size: 15px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.75)">−1:02:48</span>
    </div>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button style="height: 48px; padding: 0 18px; border-radius: 14px; background: {{c.bg}}; color: {{c.color}}; display: flex; align-items: center; gap: 8px; font-weight: 500">{{c.label}}</button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = [['Smooth · 60 fps',true],['1.0×',false],['Fit',false],['Audio · English 5.1',false],['Up next',false]]
      .map((c) => ({ label: c[0], bg: c[1] ? 'rgba(108,168,255,0.28)' : 'rgba(20,22,26,0.6)', color: c[1] ? '#DCEAFF' : '#F3F4F6' }));
    return { chips };
  }
}
</script>
</body>
</html>
