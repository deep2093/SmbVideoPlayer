<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyWing player, desktop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
</style>
</head>
<body>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; color: #F3F4F6; font-family: 'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif; font-size: 14px; background: radial-gradient(110% 90% at 60% 35%, #7a3e2e 0%, #2a1712 45%, #070505 100%)">
  <span style="position: absolute; left: 24px; top: 70px; font-size: 12px; color: rgba(255,255,255,0.5)">sample frame</span>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(rgba(0,0,0,0.6), transparent)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(transparent, rgba(0,0,0,0.82))"></div>

  <header style="position: absolute; left: 20px; right: 20px; top: 14px; display: flex; align-items: center; gap: 10px">
    <button aria-label="Back to library" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1; font-size: 16px; font-weight: 600">Harbour Run</div>
    <span style="font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(20,22,26,0.6); color: #C9CDD4">1080p · 24 → 60 fps · RTX 5070 Ti · 0 dropped</span>
  </header>

  <div role="dialog" aria-label="Motion smoothing" style="position: absolute; right: 152px; bottom: 96px; width: 320px; padding: 16px; border-radius: 14px; background: rgba(31,34,39,0.96); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-weight: 600">Motion smoothing</span>
      <button role="switch" aria-checked="true" aria-label="Motion smoothing" style="width: 40px; height: 22px; border-radius: 999px; background: #6CA8FF; position: relative"><span style="position: absolute; top: 3px; left: 21px; width: 16px; height: 16px; border-radius: 50%; background: #0B1220"></span></button></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #A9AEB8">Frame rate</span>
      <div role="radiogroup" aria-label="Frame rate" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        
          <button role="radio" aria-checked="false" style="height: 44px; border-radius: 8px; background: #16181C; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2"><span style="font-weight: 600">48</span><span style="font-size: 11px; color: #A9AEB8">2×</span></button>
        
          <button role="radio" aria-checked="true" style="height: 44px; border-radius: 8px; background: rgba(108,168,255,0.18); border: 1px solid #6CA8FF; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2"><span style="font-weight: 600">60</span><span style="font-size: 11px; color: #A9AEB8">2.5×</span></button>
        
          <button role="radio" aria-checked="false" style="height: 44px; border-radius: 8px; background: #16181C; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2"><span style="font-weight: 600">72</span><span style="font-size: 11px; color: #A9AEB8">3×</span></button>
        
          <button role="radio" aria-checked="false" style="height: 44px; border-radius: 8px; background: #16181C; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2"><span style="font-weight: 600">96</span><span style="font-size: 11px; color: #A9AEB8">4×</span></button>
        
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #A9AEB8">Quality · Better</span>
      <div style="position: relative; height: 20px; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #2B2F37"></div>
        <div style="position: absolute; left: 0; width: 75%; height: 4px; border-radius: 2px; background: #6CA8FF"></div>
        <div style="position: absolute; left: calc(75% - 8px); width: 16px; height: 16px; border-radius: 50%; background: #F3F4F6"></div>
      </div>
    </div>
    <span style="font-size: 12px; color: #7ee0b0">Keeping up · GPU 41 %</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="position: relative; height: 24px; display: flex; align-items: center">
      <div aria-hidden="true" style="position: absolute; left: calc(54% - 96px); bottom: 34px; width: 192px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="width: 192px; aspect-ratio: 16 / 9; border-radius: 8px; border: 2px solid rgba(255,255,255,0.9); background: linear-gradient(135deg,#29506e,#0c1620)"></div>
        <span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,0.7); font-variant-numeric: tabular-nums">48:30 · Chapter 4</span>
      </div>
      <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.22)"></div>
      <div style="position: absolute; left: 0; width: 58%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.38)"></div>
      <div style="position: absolute; left: 0; width: 31%; height: 6px; border-radius: 3px; background: #6CA8FF"></div>
      <div style="position: absolute; left: 14%; width: 2px; height: 6px; background: rgba(0,0,0,0.6)"></div><div style="position: absolute; left: 33%; width: 2px; height: 6px; background: rgba(0,0,0,0.6)"></div><div style="position: absolute; left: 54%; width: 2px; height: 6px; background: rgba(0,0,0,0.6)"></div><div style="position: absolute; left: 71%; width: 2px; height: 6px; background: rgba(0,0,0,0.6)"></div><div style="position: absolute; left: 88%; width: 2px; height: 6px; background: rgba(0,0,0,0.6)"></div>
      <div style="position: absolute; left: calc(31% - 8px); width: 16px; height: 16px; border-radius: 50%; background: #F3F4F6"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px">
      <button aria-label="Pause" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
      <button aria-label="Back 10 seconds" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">−10</button>
      <button aria-label="Forward 10 seconds" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">+10</button>
      <button aria-label="Volume" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg></button>
      <span style="margin-left: 8px; font-variant-numeric: tabular-nums">28:04 <span style="color: rgba(255,255,255,0.6)">/ 1:30:12</span></span>
      <div style="flex: 1"></div>
      <button style="height: 32px; padding: 0 10px; border-radius: 8px; background: rgba(108,168,255,0.28); color: #DCEAFF; font-weight: 500">Smooth 60</button>
      <button style="height: 32px; padding: 0 10px; border-radius: 8px">1.0×</button>
      <button aria-label="Subtitles and audio" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 13h4M13 13h4M7 16h7"></path></svg></button>
      <button aria-label="Picture in picture" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"></rect></svg></button>
      <button aria-label="Full screen (F)" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
    </div>
  </div>
</div>
</body>
</html>
