name: Device profile and startup measurements
on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths-ignore: ["app/schemas/**", "app/src/main/baseline-prof.txt", "**/*.md"]
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Download this commit's validated build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for profile_attempt in $(seq 1 120); do
            profile_source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.name=="Android APK") | .id' | head -1)
            if [ -n "$profile_source_run" ]; then
              profile_ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$profile_source_run/artifacts" --jq '[.artifacts[] | select(.expired==false) | .name] | (index("VideoLibrary-optimized-preview-apk")!=null and index("Benchmark-instrumentation")!=null)')
              if [ "$profile_ready" = true ]; then
                gh run download "$profile_source_run" --name VideoLibrary-optimized-preview-apk --dir optimized
                gh run download "$profile_source_run" --name Benchmark-instrumentation --dir benchmark-apk
                echo "$profile_source_run" > profile-source-run.txt
                break
              fi
              profile_conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$profile_source_run" --jq '.conclusion')
              case "$profile_conclusion" in failure|cancelled|timed_out|action_required) echo "Source build did not produce APKs: $profile_conclusion"; exit 1;; esac
            fi
            if [ "$profile_attempt" -eq 120 ]; then echo 'Timed out waiting for build artifacts'; exit 1; fi
            sleep 15
          done
      - name: Free space for emulator userdata
        run: |
          # This test-only runner does not compile or use these preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          df -h .
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install optimized/update.apk
            adb install benchmark-apk/benchmarks-optimized.apk
            adb shell am instrument -w -e additionalTestOutputDir /sdcard/Android/media/com.deepak.videolibrary.benchmark -e androidx.benchmark.suppressErrors EMULATOR com.deepak.videolibrary.benchmark/androidx.test.runner.AndroidJUnitRunner | tee benchmark-results.txt
            grep -Eq '^OK \([0-9]+ tests?\)' benchmark-results.txt
            adb pull /sdcard/Android/media/com.deepak.videolibrary.benchmark benchmark-output
      - run: python3 tools/log_baseline_profile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Device-profiles-and-benchmarks
          path: |
            profile-source-run.txt
            benchmark-results.txt
            benchmark-output/
