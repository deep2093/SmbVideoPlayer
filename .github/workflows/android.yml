name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
    branches: [main]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  select-build:
    runs-on: ubuntu-latest
    outputs:
      source_run: ${{ steps.reuse.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: reuse
        name: Find a successful build with identical application sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_run=''
          build_recipe() {
            git show "$1:.github/workflows/android.yml" | sed -n '/^  build:$/,/^  update-test:$/p' | sed '/^    needs:/d; /^    if:/d'
          }
          current_recipe=$(build_recipe "$GITHUB_SHA")
          # A manual run always performs a fresh build. Workflow-only pushes can reuse signed APKs.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            while read -r candidate_run candidate_sha; do
              git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$candidate_sha"
              if ! git diff --quiet "$candidate_sha" "$GITHUB_SHA" -- app benchmarks schema-history gradle .ci gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties; then continue; fi
              if [ "$(build_recipe "$candidate_sha")" != "$current_recipe" ]; then continue; fi
              candidate_built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/jobs" --jq 'any(.jobs[]; .name=="build" and .conclusion=="success")')
              if [ "$candidate_built" != true ]; then continue; fi
              candidate_ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/artifacts" --jq '[.artifacts[] | select(.expired==false) | .name] | (index("Preview-update-test-apks")!=null and index("Preview-storage-tests")!=null and index("SkyWing-optimized-preview-apk")!=null)')
              if [ "$candidate_ready" = true ]; then
                source_run="$candidate_run"
                echo "Reusing signed APKs and successful unit/lint build from run $candidate_run ($candidate_sha)"
                break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&per_page=30" --jq '.workflow_runs[] | select(.name=="Android APK") | "\(.id) \(.head_sha)"')
          fi
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
  build:
    needs: select-build
    if: needs['select-build'].outputs.source_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0'
      - name: Export complete source as plain text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = ['app', 'benchmarks', 'schema-history', 'gradle', 'tools', '.github']
          include = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.toml', '.yml', '.yaml', '.py', '.md', '.json', '.pro', '.txt'}
          files = [p for root in roots for p in Path(root).rglob('*') if p.is_file() and p.suffix in include and not any(x in {'build', '.gradle', '.git'} for x in p.parts)]
          files += [p for p in (Path('settings.gradle.kts'), Path('build.gradle.kts'), Path('gradle.properties'), Path('README.md')) if p.is_file()]
          files = sorted(set(files))
          with open('SMB-Video-Player-complete-source.txt', 'w', encoding='utf-8') as out:
              out.write('SMB VIDEO PLAYER - COMPLETE SOURCE CODE\n')
              out.write('Each section begins with its relative repository path.\n\n')
              for p in files:
                  out.write('\n' + '=' * 90 + '\nFILE: ' + str(p) + '\n' + '=' * 90 + '\n')
                  out.write(p.read_text(encoding='utf-8', errors='replace'))
                  out.write('\n')
          print('Exported', len(files), 'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SMB-Video-Player-source-text
          path: SMB-Video-Player-complete-source.txt
          if-no-files-found: error
      - name: Synthetic SQLite search benchmark
        run: python3 tools/benchmark_search.py
      - name: Verify preview keystore loads
        run: keytool -list -keystore .ci/preview-signing.p12 -storetype PKCS12 -storepass android
      - name: Check Kotlin dependency compatibility
        run: ./gradlew :app:dependencyInsight --configuration debugCompileClasspath --dependency kotlin-stdlib
      - name: Generate historical migration fixtures
        run: |
          ./gradlew :schema-history:assembleDebug --stacktrace
          python3 tools/prepare_schemas.py
      - name: Unit tests
        run: |
          if ! ./gradlew testDebugUnitTest --stacktrace > unit-tests.log 2>&1; then
            grep -E '^e: |FAILED|AssertionError|What went wrong' -A1 unit-tests.log | grep -v '^--$' | head -40 | sed -e 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
            tail -30 unit-tests.log
            exit 1
          fi
      - name: Retain generated Room schema history
        run: python3 tools/log_schema_manifest.py
      - name: Android lint
        run: |
          ./gradlew lintDebug --stacktrace > lint.log 2>&1 || {
            report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            { grep -E ': Error: ' "$report" 2>/dev/null; grep -E '^e: |What went wrong' -A1 lint.log; } | grep -v '^--$' | head -40 | sed -e 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
            cat "$report" 2>/dev/null || tail -40 lint.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Build debug APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Room-schemas
          path: app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-storage-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Build update APK and verify stable signing
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-universal-debug.apk preview/base.apk
          ./gradlew assembleDebug -PpreviewVersionCode=$((1000 + GITHUB_RUN_NUMBER * 2 + 1)) --stacktrace
          cp app/build/outputs/apk/debug/app-universal-debug.apk preview/update.apk
          bash tools/check_preview_signing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-update-test-apks
          path: preview/*.apk
          if-no-files-found: error
      - name: Build optimized Preview with stable update identity
        run: |
          ./gradlew :app:assembleOptimized :app:assembleProfile :benchmarks:assembleOptimized -PpreviewVersionCode=$((1000 + GITHUB_RUN_NUMBER * 2 + 1)) --stacktrace
          mkdir -p optimized
          cp app/build/outputs/apk/optimized/app-universal-optimized.apk optimized/update.apk
          # The download for phones and tablets: 64-bit ARM only, same signing so it updates the installed app.
          cp app/build/outputs/apk/optimized/app-arm64-v8a-optimized.apk optimized/SkyWing-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs optimized/SkyWing-arm64.apk | grep 'Signer #1 certificate SHA-256 digest:' > optimized/arm64-cert.txt
          diff -u preview/update-cert.txt optimized/arm64-cert.txt
          mkdir -p profile-out && cp app/build/outputs/apk/profile/app-universal-profile.apk profile-out/app-profile.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs optimized/update.apk > optimized/signing.txt
          grep 'Signer #1 certificate SHA-256 digest:' optimized/signing.txt > optimized/cert.txt
          diff -u preview/update-cert.txt optimized/cert.txt
      - name: Report APK size by part
        run: |
          total=$(stat -c %s optimized/SkyWing-arm64.apk)
          echo "::notice title=APK size::SkyWing-arm64.apk $((total / 1048576)) MB (universal test APK $(( $(stat -c %s optimized/update.apk) / 1048576 )) MB)"
          unzip -lv optimized/SkyWing-arm64.apk | awk 'NR>3 && $8 != "" { split($8, p, "/"); key = (p[1] == "lib") ? "lib/" p[2] : (p[1] ~ /\.dex$/ ? "dex" : p[1]); size[key] += $3 } END { for (k in size) printf "%s %d\n", k, size[k] / 1048576 }' | sort -k2 -n -r | head -8 | while read part mb; do echo "::notice title=APK part::$part ${mb} MB (stored)"; done
      - uses: actions/upload-artifact@v4
        with:
          # Internal only: the emulator tests need the x86_64 build. Phones use SkyWing-arm64-apk.
          name: SkyWing-optimized-preview-apk
          path: optimized/update.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWing-arm64-apk
          path: optimized/SkyWing-arm64.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Profile-source-apk
          path: profile-out/app-profile.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Benchmark-instrumentation
          path: benchmarks/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Optimized-shrinker-reports
          path: app/build/outputs/mapping/optimized/
  update-test:
    needs: [select-build, build, legacy-build]
    if: ${{ always() && needs['select-build'].result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs['legacy-build'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Preview-update-test-apks
          path: preview
          run-id: ${{ needs['select-build'].outputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: Preview-storage-tests
          path: preview/tests
          run-id: ${{ needs['select-build'].outputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Legacy-v3-preview
          path: preview/legacy
      - uses: actions/download-artifact@v4
        with:
          name: SkyWing-optimized-preview-apk
          path: optimized
          run-id: ${{ needs['select-build'].outputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Free space for emulator userdata
        run: |
          # Android 10 requires over 7 GB free even with a 4 GB data-partition setting.
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          df -h .
      - name: Start disposable SMB test share
        run: bash tools/start_test_share.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          # Avoid the Android 10 profile's oversized default userdata image.
          disk-size: 4096M
          disable-animations: true
          script: SKYWING_VISUALS=${{ matrix.api == 35 }} bash tools/ci_device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Preview-device-check-${{ matrix.api }}
          path: |
            preview/skywing-visual/
            preview/device-*.png
            preview/storage-tests.txt
            preview/device-*.xml
            preview/device-logcat.txt
            preview/device-wmv-log.txt
          if-no-files-found: ignore

  legacy-build:
    runs-on: ubuntu-latest
    steps:
      # Rebuild a permanent, signed source fixture instead of depending on an expiring run artifact.
      - uses: actions/checkout@v4
        with:
          ref: a2c52d89e26005d5c60e5b20af4dee84c05b4b4e
      - uses: actions/cache@v4
        id: legacy-cache
        with:
          path: legacy/update.apk
          key: legacy-preview-a2c52d89-jdk17-sdk35
      - uses: actions/setup-java@v4
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - if: steps.legacy-cache.outputs.cache-hit != 'true'
        run: gradle assembleDebug -PpreviewVersionCode=1 --stacktrace
      - if: steps.legacy-cache.outputs.cache-hit != 'true'
        run: mkdir -p legacy && cp app/build/outputs/apk/debug/app-debug.apk legacy/update.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-v3-preview
          path: legacy/update.apk
          if-no-files-found: error
