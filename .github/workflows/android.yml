name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
    branches: [main]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0'
      - name: Export complete source as plain text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = ['app', 'benchmarks', 'schema-history', 'gradle', 'tools', '.github']
          include = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.toml', '.yml', '.yaml', '.py', '.md', '.json', '.pro', '.txt'}
          files = [p for root in roots for p in Path(root).rglob('*') if p.is_file() and p.suffix in include and not any(x in {'build', '.gradle', '.git'} for x in p.parts)]
          files += [p for p in (Path('settings.gradle.kts'), Path('build.gradle.kts'), Path('gradle.properties'), Path('README.md')) if p.is_file()]
          files = sorted(set(files))
          with open('SMB-Video-Player-complete-source.txt', 'w', encoding='utf-8') as out:
              out.write('SMB VIDEO PLAYER - COMPLETE SOURCE CODE\n')
              out.write('Each section begins with its relative repository path.\n\n')
              for p in files:
                  out.write('\n' + '=' * 90 + '\nFILE: ' + str(p) + '\n' + '=' * 90 + '\n')
                  out.write(p.read_text(encoding='utf-8', errors='replace'))
                  out.write('\n')
          print('Exported', len(files), 'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SMB-Video-Player-source-text
          path: SMB-Video-Player-complete-source.txt
          if-no-files-found: error
      - name: Synthetic SQLite search benchmark
        run: python3 tools/benchmark_search.py
      - name: Verify preview keystore loads
        run: keytool -list -keystore .ci/preview-signing.p12 -storetype PKCS12 -storepass android
      - name: Check Kotlin dependency compatibility
        run: ./gradlew :app:dependencyInsight --configuration debugCompileClasspath --dependency kotlin-stdlib
      - name: Generate historical migration fixtures
        run: |
          ./gradlew :schema-history:assembleDebug --stacktrace
          python3 tools/prepare_schemas.py
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Retain generated Room schema history
        run: python3 tools/log_schema_manifest.py
      - name: Android lint
        run: |
          ./gradlew lintDebug --stacktrace || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Build debug APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Room-schemas
          path: app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-storage-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Build update APK and verify stable signing
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/base.apk
          ./gradlew assembleDebug -PpreviewVersionCode=$((1000 + GITHUB_RUN_NUMBER * 2 + 1)) --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk preview/update.apk
          bash tools/check_preview_signing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VideoLibrary-preview-apk
          path: preview/update.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-update-test-apks
          path: preview/*.apk
          if-no-files-found: error
      - name: Build optimized Preview with stable update identity
        run: |
          ./gradlew :app:assembleOptimized :app:assembleProfile :benchmarks:assembleOptimized -PpreviewVersionCode=$((1000 + GITHUB_RUN_NUMBER * 2 + 1)) --stacktrace
          mkdir -p optimized
          cp app/build/outputs/apk/optimized/app-optimized.apk optimized/update.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs optimized/update.apk > optimized/signing.txt
          grep 'Signer #1 certificate SHA-256 digest:' optimized/signing.txt > optimized/cert.txt
          diff -u preview/update-cert.txt optimized/cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VideoLibrary-optimized-preview-apk
          path: optimized/update.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Profile-source-apk
          path: app/build/outputs/apk/profile/app-profile.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Benchmark-instrumentation
          path: benchmarks/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Optimized-shrinker-reports
          path: app/build/outputs/mapping/optimized/
  update-test:
    needs: [build, legacy-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Preview-update-test-apks
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: Preview-storage-tests
          path: preview/tests
      - uses: actions/download-artifact@v4
        with:
          name: Legacy-v3-preview
          path: preview/legacy
      - uses: actions/download-artifact@v4
        with:
          name: VideoLibrary-optimized-preview-apk
          path: optimized
      - name: Start disposable SMB test share
        run: bash tools/start_test_share.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          # Avoid the Android 10 profile's oversized default userdata image.
          disk-size: 4096M
          disable-animations: true
          script: |
            python3 tools/check_legacy_upgrade.py
            bash tools/check_preview_update.sh
            adb install -r preview/tests/app-debug-androidTest.apk
            adb shell am instrument -w -e smbFixture true com.deepak.videolibrary.preview.test/androidx.test.runner.AndroidJUnitRunner | tee preview/storage-tests.txt
            grep -Eq '^OK \([0-9]+ tests?\)' preview/storage-tests.txt
            python3 tools/check_library_ui.py
            python3 tools/check_optimized_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Preview-device-check-${{ matrix.api }}
          path: |
            preview/device-*.png
            preview/storage-tests.txt
            preview/device-*.xml
            preview/device-logcat.txt
            preview/device-wmv-log.txt
          if-no-files-found: ignore

  legacy-build:
    runs-on: ubuntu-latest
    steps:
      # Rebuild a permanent, signed source fixture instead of depending on an expiring run artifact.
      - uses: actions/checkout@v4
        with:
          ref: a2c52d89e26005d5c60e5b20af4dee84c05b4b4e
      - uses: actions/cache@v4
        id: legacy-cache
        with:
          path: legacy/update.apk
          key: legacy-preview-a2c52d89-jdk17-sdk35
      - uses: actions/setup-java@v4
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - if: steps.legacy-cache.outputs.cache-hit != 'true'
        run: gradle assembleDebug -PpreviewVersionCode=1 --stacktrace
      - if: steps.legacy-cache.outputs.cache-hit != 'true'
        run: mkdir -p legacy && cp app/build/outputs/apk/debug/app-debug.apk legacy/update.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-v3-preview
          path: legacy/update.apk
          if-no-files-found: error
