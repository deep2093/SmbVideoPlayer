name: Create preview key lineage
# One-off, run by hand after adding the PREVIEW_V2_KEYSTORE and PREVIEW_V2_PASSWORD secrets.
# Makes the rotation record that lets installed preview builds move from the old public key to the private key.
# The record holds only certificates and a signature, no private key, so it is safe to commit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
      - name: Create the rotation record
        env:
          PREVIEW_V2_KEYSTORE: ${{ secrets.PREVIEW_V2_KEYSTORE }}
          PREVIEW_V2_PASSWORD: ${{ secrets.PREVIEW_V2_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PREVIEW_V2_KEYSTORE:?Add the PREVIEW_V2_KEYSTORE secret first}"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          work=$(mktemp -d)
          printf '%s' "$PREVIEW_V2_KEYSTORE" | base64 -d > "$work/new.p12"
          mkdir -p out
          # The old key may install data and permissions for the new one, but may never be used to roll back.
          "$signer" rotate --out out/preview-lineage.bin \
            --old-signer --ks .ci/preview-signing.p12 --ks-type PKCS12 --ks-pass pass:android \
              --set-installed-data true --set-shared-uid true --set-permission true --set-rollback false --set-auth true \
            --new-signer --ks "$work/new.p12" --ks-type PKCS12 --ks-pass env:PREVIEW_V2_PASSWORD
          "$signer" lineage --in out/preview-lineage.bin --print-certs
          rm -rf "$work"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-lineage
          path: out/preview-lineage.bin
          if-no-files-found: error
