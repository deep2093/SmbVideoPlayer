name: SkyWing Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-x64-foundation
    paths:
      - "windows/**"
      - ".github/workflows/skywing-windows-x64.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/skywing-windows-x64.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        shell: pwsh
        run: .\gradlew.bat -p windows test --no-daemon --stacktrace
      - name: Build Windows installers
        shell: pwsh
        run: .\gradlew.bat -p windows packageExe packageMsi --no-daemon --stacktrace
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: skywing-windows-x64-preview
          path: |
            windows/build/compose/binaries/main/exe/*.exe
            windows/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 7
