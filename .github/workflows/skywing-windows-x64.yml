name: SkyWing Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-x64-foundation
    paths:
      - "windows/**"
      - ".github/workflows/skywing-windows-x64.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/skywing-windows-x64.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned Windows x64 libmpv and validate archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'mpv-dev-x86_64-20261021-git-e471496c56.7z'
          $expected = 'efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633'
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/$asset"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\\libmpv.7z"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\\libmpv.7z" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "libmpv checksum mismatch: $actual" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\\libmpv-expanded" | Out-Null
          7z x "$env:RUNNER_TEMP\\libmpv.7z" "-o$env:RUNNER_TEMP\\libmpv-expanded" -y | Out-Null
          $dll = Get-ChildItem "$env:RUNNER_TEMP\\libmpv-expanded" -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll was not found in the archive' }
          $target = 'windows/build/native-resources/windows'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item $dll.FullName "$target/libmpv-2.dll"
          Write-Host "Bundled libmpv: $($dll.Length) bytes"
      - name: Provision Vulkan loader for native tests on the hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The pinned libmpv statically imports vulkan-1.dll. Hosted runners have
          # no GPU driver/runtime installation; provision only the test environment.
          $url = 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/VulkanRT-X64-1.4.363.0-Components.zip'
          $archive = "$env:RUNNER_TEMP/vulkan-runtime.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'a25a927aa8b9f0371048f1861cf88ac3b9bc9b1fb332c42d897c8ab32695769a'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Vulkan runtime checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/vulkan-runtime" -Force
          $loader = Get-ChildItem "$env:RUNNER_TEMP/vulkan-runtime" -Recurse -Filter vulkan-1.dll |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $loader) { throw 'x64 Vulkan loader not found' }
          $loader.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Unit tests
        shell: pwsh
        env:
          SKYWING_TEST_MPV: "true"
        run: |
          $env:SKYWING_TEST_MPV_DIR = (Resolve-Path 'windows/build/native-resources/windows').Path
          $env:PATH = "$env:SKYWING_TEST_MPV_DIR;$env:PATH"
          .\gradlew.bat -p windows test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skywing-windows-test-reports
          path: windows/build/reports/tests/test
          if-no-files-found: warn
      - name: Build Windows installers
        shell: pwsh
        run: .\gradlew.bat -p windows packageExe packageMsi --no-daemon --stacktrace
      - name: Verify bundled libmpv and legal files in app image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat -p windows createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'createDistributable failed' }
          $image = 'windows/build/compose/binaries/main/app'
          $dll = Get-ChildItem $image -Recurse -Filter 'libmpv-2.dll' -File | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll missing from packaged app image' }
          Write-Host "Embedded libmpv packaged: $($dll.FullName)"
          $legal = Join-Path $dll.Directory.FullName 'legal'
          $required = @('README.txt', 'SkyWing-Windows-GPL-3.0.txt', 'licenses/GPL-3.0.txt',
            'upstream/mpv-Copyright.txt', 'upstream/FFmpeg-LICENSE.md',
            'upstream/skiko-NOTICE.txt', 'upstream/Skia-LICENSE.txt',
            'JVM-RUNTIME-INVENTORY.tsv', 'NATIVE-PROVENANCE.json',
            'SOURCE-STATUS.md', 'SKYWING-SOURCE.txt', 'java-runtime/BUILD-RELEASE.txt')
          foreach ($relative in $required) {
            $path = Join-Path $legal $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Packaged legal file missing: $relative" }
            if ((Get-Item -LiteralPath $path).Length -eq 0) { throw "Packaged legal file empty: $relative" }
          }
          $native = Get-Content (Join-Path $legal 'NATIVE-PROVENANCE.json') -Raw | ConvertFrom-Json
          if ((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $native.dllSha256) {
            throw 'Packaged libmpv does not match its legal provenance'
          }
          $inventory = Import-Csv (Join-Path $legal 'JVM-RUNTIME-INVENTORY.tsv') -Delimiter "	"
          if ($inventory.Count -lt 10) { throw 'Runtime licence inventory is unexpectedly incomplete' }
          if (-not (Get-ChildItem (Join-Path $legal 'jvm') -Recurse -File |
            Where-Object { $_.Name -match 'LICENSE|NOTICE|COPYING' })) {
            throw 'No embedded JVM notices were preserved'
          }
      - name: Archive matching Windows application source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'windows/build/legal' | Out-Null
          git archive --format=zip --output=windows/build/legal/skywing-windows-source.zip HEAD windows gradle/wrapper gradlew gradlew.bat .github/workflows/skywing-windows-x64.yml
          if ($LASTEXITCODE -ne 0) { throw 'Windows source archive failed' }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: skywing-windows-x64-preview
          path: |
            windows/build/compose/binaries/main/exe/*.exe
            windows/build/compose/binaries/main/msi/*.msi
            windows/build/legal/skywing-windows-source.zip
          if-no-files-found: error
          retention-days: 7
